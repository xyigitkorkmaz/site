 const fresh=d.live&&Date.now()-(d.ts||0)<6e5;let m=fresh?d:{...d,p:d.p.map(q=>[q[0],q[1],q[2],q[3],0]),live:0,stale:1},msg=name+' hazır · Başlat ile yönlendirmeyi başlatın';
 const A=d.p[0];
 if(na){}else if(st.ll){const dd=Math.hypot((st.ll[1]-A[1])*Math.cos(A[0]*Math.PI/180)*111320,(st.ll[0]-A[0])*110540);
  if(dd>300){alertMsg('Konumdan rota başlangıcına yol hesaplanıyor…',4000);
   try{const k='ap'+st.ll.map(v=>v.toFixed(3))+A[0].toFixed(4)+A[1].toFixed(4);let ap=RC[k];
    if(!ap){const R=await fetch(`https://api.tomtom.com/routing/1/calculateRoute/${st.ll[0].toFixed(5)},${st.ll[1].toFixed(5)}:${A[0]},${A[1]}/json?key=${tk}&traffic=true&maxAlternatives=0&instructionsType=coded&sectionType=traffic&language=tr-TR&routeType=fastest&travelMode=car`);if(!R.ok)throw 0;ap=RC[k]=conv((await R.json()).routes[0],{la:A[0],lo:A[1]})}
    m=join(ap,m);msg=name+': konumdan başlangıca '+km(ap.L)+' yaklaşma yolu eklendi · Başlat ile başlayın'}catch(e){msg=name+': başlangıca yol hesaplanamadı, sadece rota açıldı'}}}
 else msg=name+' hazır (konum alınamadı, başlangıca yol eklenmedi)';
 setRoute(m);alertMsg(msg,7000)}
$('rt').onclick=openPick;$('px').onclick=closePick;
$('saved').onclick=e=>{const x=e.target.closest('[data-x]');if(x){ROUTES.splice(+x.dataset.x,1);svR();renderSaved();return}const c=e.target.closest('[data-i]');if(c){const r=ROUTES[+c.dataset.i];openRoute(r.d,r.name)}};
let qt=0;
const inp=(el,f)=>{el.onfocus=()=>AF=f;el.oninput=()=>{AF=f;clearTimeout(qt);const v=el.value.trim();if(f==0&&!v)ORIG=null;if(v.length<3){$('res').innerHTML='';return}qt=setTimeout(()=>search(v),700)}};inp($('q0'),0);inp($('q'),1);
const me=()=>st.ll?{n:'Konumum',la:st.ll[0],lo:st.ll[1]}:null;
$('sw').onclick=()=>{const t=ORIG||me(),d=DEST;if(!t){alertMsg('Konum alınamadı');return}ORIG=d;DEST=t;$('q0').value=ORIG?ORIG.n:'';$('q').value=DEST.n;if(ORIG&&DEST)plan(DEST)};
async function search(v){const k=v.toLowerCase();let r=QC[k];
 if(!r){try{const ll=st.ll?`&lat=${st.ll[0].toFixed(3)}&lon=${st.ll[1].toFixed(3)}`:'',R=await fetch(`https://api.tomtom.com/search/2/search/${encodeURIComponent(v)}.json?key=${tk}&limit=5&language=tr-TR&countrySet=TR&typeahead=true${ll}`);
  if(!R.ok){alertMsg('Arama başarısız (anahtar/kota?)');return}
  r=QC[k]=((await R.json()).results||[]).map(x=>({n:x.poi?x.poi.name:x.address.freeformAddress,a:x.address.freeformAddress,la:x.position.lat,lo:x.position.lon}))}catch(e){alertMsg('Arama başarısız');return}}
 RES=r;$('res').innerHTML=r.map((x,i)=>`<div class="card" data-r="${i}"><div><b>${esc(x.n)}</b><br><span>${esc(x.a)}</span></div></div>`).join('')||'<div class="mut">Sonuç yok</div>'}
$('res').onclick=e=>{const c=e.target.closest('[data-r]');if(c){const x=RES[+c.dataset.r];$('res').innerHTML='';if(AF==0){ORIG=x;$('q0').value=x.n}else{DEST=x;$('q').value=x.n}if(DEST)plan(DEST)}};
function conv(rt,x){const pts=rt.legs.flatMap(l=>l.points),lv=new Array(pts.length).fill(0);
 (rt.sections||[]).forEach(s=>{if(s.sectionType!='TRAFFIC')return;const m=s.magnitudeOfDelay,dl=s.delayInSeconds||0,l=(m>=4||(m==3&&dl>=120))?2:(m>=1&&dl>=45)?1:0;for(let i=s.startPointIndex;i<=s.endPointIndex;i++)lv[i]=Math.max(lv[i],l)});
 const p=[];let d=0,pr=null;
 pts.forEach((q,i)=>{if(pr){const dd=Math.hypot((q.longitude-pr.longitude)*Math.cos(q.latitude*Math.PI/180)*111320,(q.latitude-pr.latitude)*110540);
   if(dd<20&&i<pts.length-1){p[p.length-1][4]=Math.max(p[p.length-1][4],lv[i]);return}d+=dd}
  p.push([q.latitude,q.longitude,Math.round(d),0,lv[i]]);pr=q});
 const T=rt.summary.travelTimeInSeconds,Ld=Math.round(d);p.forEach(a=>a[3]=Math.round(a[2]/Ld*T));
 const t=[];((rt.guidance&&rt.guidance.instructions)||[]).forEach(n=>{const a=n.turnAngleInDecimalDegrees,o=n.routeOffsetInMeters;
  if(typeof a!='number'||/DEPART|ARRIVE|WAYPOINT/.test(n.maneuver||''))return;if(Math.abs(a)>=25&&o>5&&o<Ld-10)t.push([o,Math.round(a)])});
 t.sort((a,b)=>a[0]-b[0]);return{p,t,s:[[x.la,x.lo,Ld,0]],L:Ld,T,live:1,ts:Date.now()}}
async function plan(x){const o=ORIG?[ORIG.la,ORIG.lo]:(st.ll||ROUTES[0].d.p[0].slice(0,2));if(!ORIG&&!st.ll)alertMsg('Konum alınamadı, eklenmiş rotanın başlangıcı kullanıldı',5000);
 const key=o.map(v=>v.toFixed(3))+'|'+x.la.toFixed(4)+','+x.lo.toFixed(4);let a=RC[key];
 if(!a){$('alts').innerHTML='<div class="mut">Rotalar hesaplanıyor…</div>';
  try{const R=await fetch(`https://api.tomtom.com/routing/1/calculateRoute/${o[0].toFixed(5)},${o[1].toFixed(5)}:${x.la},${x.lo}/json?key=${tk}&traffic=true&maxAlternatives=2&instructionsType=coded&sectionType=traffic&language=tr-TR&routeType=fastest&travelMode=car`);
   if(!R.ok)throw 0;a=RC[key]=(await R.json()).routes.map(rt=>({d:conv(rt,x),dl:rt.summary.trafficDelayInSeconds||0}))}catch(e){$('alts').innerHTML='<div class="mut">Rota hesaplanamadı</div>';return}}
 ALT=a;DEST=x;NA=!!ORIG;$('alts').innerHTML='<h3>Rota seçenekleri</h3>'+a.map((r,i)=>`<div class="card" data-a="${i}"><div><b>${i?'Alternatif '+i:'En hızlı'} · ${fT(r.d.T)}</b><br><span>${km(r.d.L)}${r.dl>=120?' · +'+Math.round(r.dl/60)+' dk trafik':' · trafik akıcı'}</span></div><button data-s="${i}">Kaydet</button></div>`).join('')}
$('alts').onclick=e=>{const sv=e.target.closest('[data-s]');if(sv){const r=ALT[+sv.dataset.s];ROUTES.push({name:DEST.n,d:r.d});svR();renderSaved();sv.textContent='✓';return}const c=e.target.closest('[data-a]');if(c)openRoute(ALT[+c.dataset.a].d,DEST.n,NA)};
renderSaved();openPick();
{const sh=$('sheet'),setSh=()=>document.documentElement.style.setProperty('--sh',sh.offsetHeight+8+'px');
 if(window.ResizeObserver)new ResizeObserver(setSh).observe(sh);setSh();addEventListener('resize',setSh);
 $('hd').onclick=()=>{sh.classList.toggle('min');$('hd').setAttribute('aria-expanded',!sh.classList.contains('min'));setSh()}}
// sesli komut
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
const nz=s=>s.toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');
function cmd(raw){const r=nz(raw),k=M.find(m=>m.d>st.d+8),rem=TT-tOf(st.d),ns=S.find(s=>s.d>st.d+10);
 const h=t=>{$('heard').textContent='“'+raw.trim()+'” → '+t};
 if(/rotalar|rota sec/.test(r)){h('rotalar');openPick()}
 else if(/durak/.test(r)){const t=ns?`${ns.name}, ${fD(ns.d-st.d)} ileride, tahmini ${clk(tOf(ns.d)-tOf(st.d))}`:'Önünüzde durak yok';h(t);say(t,1)}
 else if(/baslat|basla|devam|yola cik/.test(r)){h('başlat');if(!st.live)play()}
 else if(/\bdur\b|duraklat|bekle/.test(r)){h('durdur');if(st.live)play()}
 else if(/sonraki|donus|talimat|nereye/.test(r)){const t=k?`${fD(k.d-st.d)} sonra, ${mtx(k).toLowerCase()}`:'Rota bitti';h(t);say(t,1)}
 else if(/kalan sure|varis|kac dakika|ne zaman/.test(r)){const t=`Tahmini varış ${clk(rem)}, kalan süre ${fT(rem)}`;h(t);say(t,1)}
 else if(/kalan mesafe|kac km|kilometre|mesafe/.test(r)){const t=`Kalan mesafe ${fD(L-st.d)}`;h(t);say(t,1)}
 else if(/trafik/.test(r)){const t='Şu an trafik: '+TN[P[at(st.d).i][4]].toLowerCase();h(t);say(t,1)}
 else if(/sessiz|sesi kapat/.test(r)){h('ses kapalı');say('Sesli yönlendirme kapalı',1);st.voice=false;$('snd').setAttribute('aria-pressed',false)}
 else if(/sesi ac|sesli/.test(r)){st.voice=true;$('snd').setAttribute('aria-pressed',true);h('ses açık');say('Sesli yönlendirme açık')}
 else if(/yakinlas|buyut/.test(r)){h('yakınlaştır');$('zi').click()}
 else if(/uzaklas|kucult/.test(r)){h('uzaklaştır');$('zo').click()}
 else if(/genel|tum rota|harita/.test(r)){h('genel görünüm');$('ov').click()}
 else if(/hizlan|hizli/.test(r)){h('hızlı');$('mult').selectedIndex=Math.min(3,$('mult').selectedIndex+1)}
 else if(/yavasla|yavas/.test(r)){h('yavaş');$('mult').selectedIndex=Math.max(0,$('mult').selectedIndex-1)}
 else if(/bastan|yeniden/.test(r)){h('baştan');st.t=TT;simPlay()}
 else h('anlaşılamadı')}
$('mic').onclick=()=>{
 if(!SR){alertMsg('Bu tarayıcı sesli komutu desteklemiyor (Chrome veya Safari deneyin)');return}
 if(rec){const r=rec;rec=null;r.stop();$('mic').setAttribute('aria-pressed',false);$('heard').textContent='Mikrofon kapalı';return}
 rec=new SR();rec.lang='tr-TR';rec.continuous=true;rec.interimResults=false;
 rec.onresult=e=>cmd(e.results[e.results.length-1][0].transcript);
 rec.onend=()=>{if(rec)try{rec.start()}catch(x){}};
 rec.onerror=e=>{if(e.error=='not-allowed'||e.error=='service-not-allowed'){rec=null;$('mic').setAttribute('aria-pressed',false);alertMsg('Mikrofon izni verilmedi')}};
 try{rec.start();$('mic').setAttribute('aria-pressed',true);$('heard').textContent='Dinliyorum…'}catch(x){}};
